# Continuous integration (DEVELOPMENT_ROADMAP.md, Phase 1): the same checks as CLAUDE.md "Команды".
# Third-party actions are pinned to commit SHAs; Dependabot keeps them current (.github/dependabot.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: Repository (version, secrets, scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Script tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Secret scan (tracked files)
        run: python3 scripts/check_secrets.py
      - name: VERSION is valid and was bumped (ADR-009)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            against="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            against="$BEFORE"
          else
            against="HEAD~1"
          fi
          python3 scripts/version.py check --against "$against"

  backend:
    name: Backend (tests on PostgreSQL + Redis, ruff, mypy, worker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the dev stack (postgres, redis, migrate, backend, worker, scheduler)
        run: docker compose up --detach --build --wait --wait-timeout 300 backend worker scheduler s3
      - name: Tests (unit + API + integration)
        run: docker compose exec -T backend pytest -p no:cacheprovider
      - name: Ruff
        run: |
          docker compose exec -T backend ruff check --no-cache src tests alembic
          docker compose exec -T backend ruff format --no-cache --check src tests alembic
      - name: Mypy (strict)
        run: docker compose exec -T backend mypy --cache-dir=/dev/null
      - name: Worker round trip with retries
        run: docker compose exec -T worker python -m plummy.cli worker check --simulate-failures 1
      - name: Readiness
        run: >-
          docker compose exec -T backend python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  ingestion:
    name: Ingestion (worker-ingestion image, Docling parser offline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the worker-ingestion image (dependencies and Docling models)
        run: docker compose build worker-ingestion
      # The container is on the internal data network only: parsing must work without internet access.
      - name: Parser tests in the image, without network access
        run: >-
          docker compose run --rm --no-deps worker-ingestion
          pytest -p no:cacheprovider tests/ingestion tests/unit/test_isolated_parser.py
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  frontend:
    name: Frontend (tests, lint, typecheck, format, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: npm from packageManager (engine-strict rejects npm 10)
        run: npm install --global npm@11.21.2
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build

  e2e:
    name: E2E (Playwright, fake OpenAI-compatible provider)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: plummy-e2e
      COMPOSE_FILE: compose.yaml:compose.e2e.yaml
      COMPOSE_PROFILES: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A fresh instance: the global setup creates the first administrator with the setup token.
      - name: Start the stack (no published ports, fake provider on an internal network)
        run: >-
          docker compose up --detach --build --wait --wait-timeout 400
          backend worker worker-ingestion scheduler frontend fake-llm fake-google fake-microsoft
      - name: Playwright (typecheck, then the tests in Chromium)
        run: docker compose run --rm -T e2e
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200 backend worker worker-ingestion frontend
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  production:
    name: Production stack (compose.prod.yaml, Nginx/TLS, S3, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: plummy-prod
      COMPOSE_FILE: compose.prod.yaml:deploy/prod/smoke/compose.smoke.yaml
      COMPOSE_PROFILES: s3
      UPGRADE_FROM: v0.4.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the release tag of the upgrade path
      # As on a server: secrets generated as root, each file owned by the service that reads it, mode 0400.
      - name: Secrets, a self-signed certificate and the environment
        run: |
          sudo sh deploy/prod/init-secrets.sh
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=localhost \
            -addext "subjectAltName=DNS:localhost" \
            -keyout "$RUNNER_TEMP/privkey.pem" -out "$RUNNER_TEMP/fullchain.pem" 2>/dev/null
          sudo chown 101:101 "$RUNNER_TEMP/privkey.pem" && sudo chmod 0400 "$RUNNER_TEMP/privkey.pem"
          cat > "$RUNNER_TEMP/prod.env" <<EOF
          PUBLIC_URL=https://localhost:8443
          PLUMMY_SERVER_NAME=localhost
          PLUMMY_BIND_ADDRESS=127.0.0.1
          PLUMMY_HTTP_PORT=8080
          PLUMMY_HTTPS_PORT=8443
          PLUMMY_TLS_CERT=$RUNNER_TEMP/fullchain.pem
          PLUMMY_TLS_KEY=$RUNNER_TEMP/privkey.pem
          EOF
          echo "COMPOSE_ENV_FILES=$RUNNER_TEMP/prod.env" >> "$GITHUB_ENV"
      # Upgrade path (ADR-023 §6, ADR-024 §5): a database of the previous release has one role, the schema
      # owner, and its schema is created by that release's migrations. The administrator's one-time step adds
      # the runtime role; the stack of this commit then migrates to head and the whole scenario runs on top.
      - name: Upgrade path, part 1 (database of the previous release, then split-db-roles.sh)
        run: |
          git worktree add --detach "$RUNNER_TEMP/previous" "$UPGRADE_FROM"
          docker build --quiet --file "$RUNNER_TEMP/previous/apps/backend/Dockerfile" --target prod \
            --tag "plummy-upgrade-from:$UPGRADE_FROM" "$RUNNER_TEMP/previous"
          docker compose up --detach --wait postgres
          docker compose exec -T postgres psql -X -q -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c 'REVOKE ALL ON DATABASE plummy FROM plummy_app' -c 'DROP ROLE plummy_app'
          docker run --rm --network "${COMPOSE_PROJECT_NAME}_data" --user 10001 \
            --env APP_ENV=development --env REDIS_URL=redis://redis:6379/0 \
            --volume "$PWD/deploy/prod/secrets/migration_database_url:/run/secrets/database_url:ro" \
            "plummy-upgrade-from:$UPGRADE_FROM" \
            sh -c 'DATABASE_URL=$(cat /run/secrets/database_url) exec alembic upgrade head'
          # As root, like the secrets: the password file belongs to the postgres user.
          sudo --preserve-env=COMPOSE_PROJECT_NAME,COMPOSE_FILE,COMPOSE_PROFILES,COMPOSE_ENV_FILES \
            sh deploy/scripts/split-db-roles.sh
      - name: Start the stack (prod images, bundled S3 server; migrates the previous release's schema)
        run: docker compose up --detach --build --wait --wait-timeout 600
      - name: Smoke test through Nginx (headers, CSP, setup, upload, indexing, search, streamed answer)
        run: |
          docker compose run --rm --no-deps -T migrate cat /var/lib/plummy/bootstrap/setup-token \
            > "$RUNNER_TEMP/setup-token"
          python3 deploy/prod/smoke/smoke.py run --base-url https://localhost:8443 --http-url http://localhost:8080 \
            --ca-file "$RUNNER_TEMP/fullchain.pem" --setup-token-file "$RUNNER_TEMP/setup-token" \
            --state-file "$RUNNER_TEMP/smoke-state.json"
      - name: Stack checks (published ports, secrets not in docker inspect, read-only, internal networks)
        run: sh deploy/prod/smoke/checks.sh
      # Restore drill (DEPLOYMENT.md §10): backup, a deletion after it, the volumes dropped, restore with the
      # deletions reapplied; the deleted document must stay deleted, the kept one must be reindexable.
      - name: Restore drill (backup, deletion, restore, verification)
        run: |
          smoke() {
            python3 deploy/prod/smoke/smoke.py "$1" --base-url https://localhost:8443 \
              --ca-file "$RUNNER_TEMP/fullchain.pem" --state-file "$RUNNER_TEMP/smoke-state.json"
          }
          sh deploy/scripts/backup.sh "$RUNNER_TEMP/backups"
          backup=$(ls -d "$RUNNER_TEMP"/backups/plummy-*)
          smoke delete-document
          since=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["dump_started_at"])' \
            "$backup/manifest.json")
          docker compose exec -T backend python -m plummy.cli maintenance export-deletions --since "$since" \
            --output - > "$RUNNER_TEMP/deletions.json"
          docker compose down --volumes
          sh deploy/scripts/restore.sh "$backup" --deletions "$RUNNER_TEMP/deletions.json"
          smoke verify-restore
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  dependencies:
    name: Dependency audit (pip-audit, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # All extras: the worker-ingestion image (Docling, CPU-only PyTorch) included. The CPU wheels carry a local
      # version (2.15.0+cpu) that PyPI does not know; they are the same upstream release, audited without it.
      - name: Python dependencies (uv.lock, runtime + dev + ingestion)
        run: |
          uv export --project apps/backend --frozen --no-hashes --no-emit-project --all-extras \
            --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          sed -i 's/+cpu / /' "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --strict --no-deps --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Runtime (bundled) packages fail on high; build/test tooling fails on critical only. Tooling advisories
      # without a fixed release (e.g. picomatch ReDoS via vite/eslint, glob patterns we control) are tracked
      # through Dependabot instead of blocking every build.
      - name: npm runtime dependencies (high and critical)
        working-directory: apps/frontend
        run: npm audit --omit=dev --audit-level=high --package-lock-only
      - name: npm all dependencies (critical)
        working-directory: apps/frontend
        run: npm audit --audit-level=critical --package-lock-only
      - name: npm e2e test tooling (critical)
        working-directory: apps/e2e
        run: npm audit --audit-level=critical --package-lock-only

  dependency-review:
    name: Dependency review (new dependencies in the PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
