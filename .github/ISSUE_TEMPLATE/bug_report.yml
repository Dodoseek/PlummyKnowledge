name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities must not be reported here** — use a private advisory (link in "New issue").
        Do not paste secrets, tokens, passwords, document content or private prompts.
  - type: input
    id: version
    attributes:
      label: Version
      description: The `VERSION` file of your checkout, or the version in the web app's header.
      placeholder: 0.5.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup / authentication
        - Users, groups, roles
        - AI providers / models
        - Knowledge bases / documents / indexing
        - Search / chat / citations
        - Connectors (Google Drive, Microsoft 365)
        - Backend API
        - Frontend
        - Deployment / upgrade / backup
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up --build
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal data before pasting.
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker / Compose versions, browser, development stack or compose.prod.yaml, storage (local, built-in or external S3), provider types.
