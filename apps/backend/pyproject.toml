[project]
name = "plummy-backend"
dynamic = ["version"]
# Версия приложения не дублируется здесь: единственный источник — файл VERSION в корне
# репозитория (ADR-009); backend читает его во время выполнения (plummy.core.version).
description = "PlummyKnowledge backend: FastAPI API (and, later, Celery workers)."
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.160,<0.170",
    "uvicorn[standard]>=0.50,<0.60",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy[asyncio]>=2.0.40,<2.2",
    "asyncpg>=0.30,<0.40",
    "alembic>=1.16,<2",
    "redis>=6,<9",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3",
    "celery[redis]>=5.5,<6",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.2,<2",
    "httpx>=0.28,<0.29",
    "ruff>=0.15,<0.18",
    "mypy>=1.18,<3",
]

[tool.uv]
# Backend — приложение, а не библиотека: пакет не собирается и не устанавливается,
# код запускается из src/ (uvicorn --app-dir src, pytest pythonpath, alembic prepend_sys_path).
package = false

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "S", "ASYNC", "PT", "N", "TID",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["plummy"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires running PostgreSQL and Redis (DATABASE_URL / REDIS_URL)",
]
addopts = ["--strict-markers", "-ra"]
filterwarnings = [
    "error",
    # celery 5.7 Redis result backend calls redis-py's deprecated setex (third-party, no behavior impact).
    "ignore:Call to deprecated setex:DeprecationWarning",
]
