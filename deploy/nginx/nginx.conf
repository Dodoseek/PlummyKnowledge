# PlummyKnowledge — Nginx of the production stack (compose.prod.yaml, ADR-023 §4).
# Runs as an unprivileged user on a read-only root filesystem: pid, temporary files and the rendered
# templates (NGINX_ENVSUBST_OUTPUT_DIR) live in /tmp (tmpfs).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # No query strings in the access log: they can carry OAuth codes, cursors and search parameters.
  log_format plummy '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" $status '
                    '$body_bytes_sent $request_time "$http_user_agent"';
  access_log /dev/stdout plummy;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  client_header_timeout 30s;
  client_body_timeout 60s;
  send_timeout 60s;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  include /tmp/nginx-conf/*.conf;
}
