# Common settings of the locations proxied to the API (ADR-023 §4).
proxy_pass http://plummy_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Overwritten, never appended: the API trusts X-Forwarded-For only from this Nginx (FORWARDED_ALLOW_IPS) and
# must see the client address, not a value the client sent.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Real-IP "";
# Headers set here once for every response, never doubled by the API.
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_redirect off;
proxy_connect_timeout 5s;
include /etc/nginx/plummy/security-headers.conf;
