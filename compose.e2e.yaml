# PlummyKnowledge — end-to-end tests (Playwright) against the dev stack and a fake OpenAI-compatible provider.
#
#   docker compose -p plummy-e2e -f compose.yaml -f compose.e2e.yaml --profile e2e up --build --detach --wait \
#     backend worker worker-ingestion scheduler frontend fake-llm fake-google fake-microsoft
#   docker compose -p plummy-e2e -f compose.yaml -f compose.e2e.yaml --profile e2e run --rm e2e
#   docker compose -p plummy-e2e -f compose.yaml -f compose.e2e.yaml --profile e2e down --volumes
#
# Use its own project name (-p): the tests create the first administrator of a fresh instance. Nothing here is
# for production: the fake provider, the fake Google and Microsoft, their allowlist entries, the OAuth clients of
# the fakes (test values, not real Google or Entra clients) and the test runner exist only in this file.

x-fake-oauth-clients: &fake-oauth-clients
  GOOGLE_OAUTH_CLIENT_ID: e2e-client.apps.googleusercontent.com
  GOOGLE_OAUTH_CLIENT_SECRET: e2e-fake-google-client-value
  MICROSOFT_OAUTH_TENANT_ID: e2e.onmicrosoft.com
  MICROSOFT_OAUTH_CLIENT_ID: 00000000-0000-4000-8000-0000000e2e01
  MICROSOFT_OAUTH_CLIENT_SECRET: e2e-fake-microsoft-client-value

services:
  # API and worker reach the fake provider through the network allowlist (ADR-007), like a local LLM.
  # No published ports: the e2e stack can run next to the dev stack; the runner reaches it from inside.
  backend:
    ports: !reset []
    environment:
      <<: *fake-oauth-clients
      CONFIG_FILE: /etc/plummy/plummy.toml
    volumes:
      - ./deploy/e2e/plummy.toml:/etc/plummy/plummy.toml:ro
    networks:
      llm: {}

  worker:
    environment:
      <<: *fake-oauth-clients
      CONFIG_FILE: /etc/plummy/plummy.toml
    volumes:
      - ./deploy/e2e/plummy.toml:/etc/plummy/plummy.toml:ro
    networks:
      llm: {}

  # The tests upload Markdown, parsed in-process by the plain-text parser: the slim image is enough (the Docling
  # image and its parser are covered by the CI ingestion job).
  worker-ingestion:
    build:
      target: dev

  # The test runner shares this container's network namespace (see `e2e`), so it also needs the fake provider's
  # network to read its request log. The application itself never calls it from the browser.
  frontend:
    ports: !reset []
    networks:
      llm: {}

  fake-llm:
    profiles: [e2e]
    image: python:3.13-slim
    command: ["python", "/fake/fake_llm.py"]
    volumes:
      - ./deploy/e2e/fake_llm.py:/fake/fake_llm.py:ro
    networks:
      llm: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 10

  # Google's OAuth and Drive endpoints for the connector (ADR-020). The browser opens its consent page by name
  # (the runner shares the frontend's network namespace), the backend and the worker call it through the allowlist.
  fake-google:
    profiles: [e2e]
    image: python:3.13-slim
    command: ["python", "/fake/fake_google.py"]
    environment:
      FAKE_GOOGLE_CLIENT_ID: e2e-client.apps.googleusercontent.com
      FAKE_GOOGLE_CLIENT_SECRET: e2e-fake-google-client-value
      FAKE_GOOGLE_REDIRECT_URI: http://localhost:5173/api/v1/data-sources/oauth/callback
    volumes:
      - ./deploy/e2e/fake_google.py:/fake/fake_google.py:ro
    networks:
      llm: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 10

  # Microsoft's identity platform and Graph for the Microsoft 365 connector (ADR-021), reached like fake-google.
  fake-microsoft:
    profiles: [e2e]
    image: python:3.13-slim
    command: ["python", "/fake/fake_microsoft.py"]
    environment:
      FAKE_MICROSOFT_TENANT: e2e.onmicrosoft.com
      FAKE_MICROSOFT_CLIENT_ID: 00000000-0000-4000-8000-0000000e2e01
      FAKE_MICROSOFT_CLIENT_SECRET: e2e-fake-microsoft-client-value
      FAKE_MICROSOFT_REDIRECT_URI: http://localhost:5173/api/v1/data-sources/oauth/callback
    volumes:
      - ./deploy/e2e/fake_microsoft.py:/fake/fake_microsoft.py:ro
    networks:
      llm: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 10

  # Playwright with its browsers. It runs in the frontend's network namespace: the browser opens
  # http://localhost:5173, the origin the backend trusts (PUBLIC_URL), exactly as on a developer machine.
  # The bootstrap volume is mounted read-only so that the global setup can create the first administrator.
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /e2e
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx tsc --noEmit && npx playwright test"]
    environment:
      CI: ${CI:-}
      E2E_BASE_URL: http://localhost:5173
      E2E_FAKE_LLM_URL: http://fake-llm:8080
      E2E_FAKE_GOOGLE_URL: http://fake-google:8080
      E2E_FAKE_MICROSOFT_URL: http://fake-microsoft:8080
      E2E_SETUP_TOKEN_FILE: /bootstrap/setup-token
    volumes:
      - ./apps/e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
      - bootstrap-data:/bootstrap:ro
    network_mode: service:frontend
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      fake-llm:
        condition: service_healthy
      fake-google:
        condition: service_healthy
      fake-microsoft:
        condition: service_healthy

networks:
  # The fake provider's network: internal (no internet), with a fixed subnet for the allowlist entry.
  llm:
    internal: true
    ipam:
      config:
        - subnet: 10.213.17.0/24

volumes:
  e2e-node-modules:
