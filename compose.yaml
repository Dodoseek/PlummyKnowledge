# PlummyKnowledge — local development stack.
#
#   docker compose up --build
#
# Frontend: http://localhost:5173 · API: http://localhost:8000/api/v1 (docs: /api/v1/docs)
#
# Development only: default credentials below are for a database that is never published outside the
# Docker network. PostgreSQL has two roles (ADR-011): the bootstrap superuser `postgres`, used only by the
# container's init script (deploy/postgres/initdb) to create the application role, database and extensions,
# and the application role `plummy` (no superuser) used by migrations and the API.
# The production profile (Nginx/TLS, MinIO, secrets as files, resource limits) is roadmap Phase 11 — see
# docs/DEPLOYMENT.md. Variables can be overridden in a local .env (see .env.example).

name: plummy

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  APP_DEBUG: ${APP_DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SECRET_KEY: ${SECRET_KEY:-}
  DATABASE_URL: postgresql+asyncpg://${PLUMMY_DB_USER:-plummy}:${PLUMMY_DB_PASSWORD:-plummy_dev_password}@postgres:5432/${PLUMMY_DB_NAME:-plummy}
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-}
  # Origin of the web UI; state-changing requests from other origins are rejected (ADR-013).
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:5173}
  # Plain HTTP in development: the session cookie is `pk_session` without Secure (forbidden in production).
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  SETUP_MODE: ${SETUP_MODE:-web}
  BOOTSTRAP_DIR: /var/lib/plummy/bootstrap
  # Key ring of stored secrets (ADR-016), created by `migrate` in the secrets-data volume on first start.
  SECRETS_KEYRING_FILE: /var/lib/plummy/secrets/keyring.json
  # Document storage (originals and quarantine), shared by the API and the workers.
  STORAGE_PATH: /var/lib/plummy/storage

# The ingestion worker parses untrusted documents: database, Redis and storage only. No key ring, provider
# secrets or setup token reach it (SECURITY_MODEL.md §9).
x-ingestion-env: &ingestion-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${PLUMMY_DB_USER:-plummy}:${PLUMMY_DB_PASSWORD:-plummy_dev_password}@postgres:5432/${PLUMMY_DB_NAME:-plummy}
  REDIS_URL: redis://redis:6379/0
  STORAGE_PATH: /var/lib/plummy/storage

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      # Bootstrap superuser: used only by the init script below, never given to the application.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      # Application role and database, created by deploy/postgres/initdb on the first start of the volume.
      PLUMMY_DB_USER: ${PLUMMY_DB_USER:-plummy}
      PLUMMY_DB_PASSWORD: ${PLUMMY_DB_PASSWORD:-plummy_dev_password}
      PLUMMY_DB_NAME: ${PLUMMY_DB_NAME:-plummy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./deploy/postgres/extensions.sql:/plummy/extensions.sql:ro
    networks: [data]
    healthcheck:
      # TCP check: during initialisation the server listens on the Unix socket only, so the service stays
      # unhealthy until the init script (role, database, extensions) has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${PLUMMY_DB_USER}\" -d \"$${PLUMMY_DB_NAME}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.6-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot step: creates the secrets key ring if the volume has none (development only; in production the
  # key ring is provided as a file, DEPLOYMENT.md §4), applies Alembic migrations before the API starts
  # (schema is never changed by the API), then issues the one-time setup token into the bootstrap volume
  # while the instance is not initialized (idempotent: a valid token is kept; after setup it does nothing).
  # Neither the key ring nor the token is ever printed:
  #   docker compose run --rm migrate cat /var/lib/plummy/bootstrap/setup-token
  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: dev
    command:
      - sh
      - -c
      - python -m plummy.cli secrets init-keyring && alembic upgrade head && python -m plummy.cli setup init-token
    environment: *backend-env
    volumes:
      - ./apps/backend/alembic:/app/alembic:ro
      - ./apps/backend/src:/app/src:ro
      # Only migrate (the server-side CLI) sees the token; the API container does not mount it.
      - bootstrap-data:/var/lib/plummy/bootstrap
      - secrets-data:/var/lib/plummy/secrets
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: dev
    environment:
      <<: *backend-env
      # Trust X-Forwarded-For from the Vite proxy (development only; in production only Nginx is trusted).
      FORWARDED_ALLOW_IPS: "*"
      # The S3 adapter's integration tests (tests/integration/test_storage_contract.py); unset = skipped.
      S3_TEST_URL: http://s3:7070
      S3_TEST_ACCESS_KEY_ID: ${S3_DEV_ACCESS_KEY:-plummy-dev}
      S3_TEST_SECRET_ACCESS_KEY: ${S3_DEV_SECRET_KEY:-plummy-dev-secret-key}
    volumes:
      - ./apps/backend/src:/app/src:ro
      - ./apps/backend/alembic:/app/alembic:ro
      - ./apps/backend/tests:/app/tests:ro
      - ./apps/backend/evaluation:/app/evaluation:ro
      - ./apps/backend/pyproject.toml:/app/pyproject.toml:ro
      - ./VERSION:/VERSION:ro
      - secrets-data:/var/lib/plummy/secrets:ro
      - storage-data:/var/lib/plummy/storage
    ports:
      - "127.0.0.1:8000:8000"
    networks: [data, edge]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    # No restart policy: a fatal startup error (e.g. invalid configuration) stops the container with exit code 1.

  # Celery worker (ARCHITECTURE.md §3): same image and configuration as the API, no published ports. Takes the
  # default, embeddings, maintenance and connectors queues (documents are parsed by worker-ingestion): the index
  # phase and the sync of external sources (ADR-020) call providers, so it has outbound access (edge network);
  # every connection still passes the egress policy of SafeHttpClient (ADR-007). Code changes need
  # `docker compose restart worker`.
  #   docker compose exec worker python -m plummy.cli worker check
  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: dev
    command:
      - sh
      - -c
      - >-
        python -m plummy.check_config &&
        exec celery -A plummy.workers.main --quiet worker --loglevel INFO
        --concurrency ${WORKER_CONCURRENCY:-2} --queues default,embeddings,maintenance,connectors
        --without-gossip --without-mingle
    environment: *backend-env
    volumes:
      - ./apps/backend/src:/app/src:ro
      - ./VERSION:/VERSION:ro
      - secrets-data:/var/lib/plummy/secrets:ro
      - storage-data:/var/lib/plummy/storage
    networks: [data, edge]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A plummy.workers.main inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s

  # Celery beat (ARCHITECTURE.md §3): sends the periodic maintenance tasks (quarantine cleanup, re-publishing
  # queued jobs, purge sweep) to the `maintenance` queue. Exactly one instance. It only talks to Redis: no
  # key ring, storage or provider access. The schedule state file is temporary (intervals, not cron times).
  scheduler:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: dev
    command:
      - sh
      - -c
      - >-
        python -m plummy.check_config &&
        exec celery -A plummy.workers.main --quiet beat --loglevel INFO
        --schedule /tmp/plummy-beat-schedule
    environment: *ingestion-env
    volumes:
      - ./apps/backend/src:/app/src:ro
      - ./VERSION:/VERSION:ro
    networks: [data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s

  # Ingestion worker (ADR-008 stages 2-7): its own image with Docling and its models, the `ingestion` queue
  # only, one document at a time. The data network is internal, so the parser has no internet access; the
  # parser itself runs in a child process with a timeout and rlimits. mem_limit bounds the real memory (the
  # child's address-space cap only stops runaway allocations). Code changes need a restart.
  #   docker compose restart worker-ingestion
  worker-ingestion:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: ingestion-dev
    command:
      - sh
      - -c
      - >-
        python -m plummy.check_config &&
        exec celery -A plummy.workers.main --quiet worker --loglevel INFO
        --concurrency 1 --queues ingestion --without-gossip --without-mingle
    environment: *ingestion-env
    volumes:
      - ./apps/backend/src:/app/src:ro
      - ./apps/backend/tests:/app/tests:ro
      - ./apps/backend/pyproject.toml:/app/pyproject.toml:ro
      - ./VERSION:/VERSION:ro
      - storage-data:/var/lib/plummy/storage
    networks: [data]
    mem_limit: ${INGESTION_MEMORY_LIMIT:-4g}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A plummy.workers.main inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3
    stop_grace_period: 60s

  # S3-compatible storage (ADR-022) for the integration tests of the S3 adapter; the dev stack itself keeps the
  # local backend. versitygw over a directory: buckets and objects are plain directories and files in the
  # s3-data volume. Development credentials only; the tests create their own bucket.
  s3:
    image: versity/versitygw:v1.11.0
    entrypoint: ["versitygw", "--port", ":7070", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${S3_DEV_ACCESS_KEY:-plummy-dev}
      ROOT_SECRET_KEY: ${S3_DEV_SECRET_KEY:-plummy-dev-secret-key}
    volumes:
      - s3-data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7070"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: dev
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./apps/frontend/src:/app/src:ro
      - ./apps/frontend/public:/app/public:ro
      - ./apps/frontend/index.html:/app/index.html:ro
      # Compared at start with the lock file the image was built from (stale dependencies stop the container).
      - ./apps/frontend/package-lock.json:/app/package-lock.json:ro
      - ./VERSION:/VERSION:ro
    ports:
      - "127.0.0.1:5173:5173"
    networks: [edge]
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: unless-stopped

networks:
  # PostgreSQL and Redis live on an internal network without external access or published ports.
  data:
    internal: true
  edge: {}

volumes:
  postgres-data:
  redis-data:
  bootstrap-data:
  # Development key ring only. `docker compose down -v` deletes it together with the database.
  secrets-data:
  # Uploaded documents and quarantine (development data, deleted by `docker compose down -v`).
  storage-data:
  # Buckets of the dev S3 server (integration tests only).
  s3-data:
